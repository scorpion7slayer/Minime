name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  OFFICIAL_BUNDLE_ID: io.github.scorpion7slayer.minime

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Resolve and validate the release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, for example v1.2.3" >&2
            exit 1
          fi

          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$version" != "$cargo_version" ]]; then
            echo "Tag version $version does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

          echo "MINIME_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build Windows or Linux binary
        if: runner.os != 'macOS'
        env:
          MINIME_APP_ID: ${{ env.OFFICIAL_BUNDLE_ID }}
        run: cargo build --release

      - name: Install the Developer ID certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          : "${MACOS_CERTIFICATE:?Missing MACOS_CERTIFICATE GitHub secret}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Missing MACOS_CERTIFICATE_PASSWORD GitHub secret}"

          certificate_path="$RUNNER_TEMP/minime-developer-id.p12"
          keychain_path="$RUNNER_TEMP/minime-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

          echo "MINIME_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "MINIME_CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"

      - name: Build and sign the macOS application
        if: runner.os == 'macOS'
        env:
          MINIME_RELEASE: "1"
          MINIME_BUNDLE_ID: ${{ env.OFFICIAL_BUNDLE_ID }}
          MINIME_BUILD_NUMBER: ${{ github.run_number }}
          MINIME_SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: ./scripts/package-macos.sh

      - name: Notarize and staple the macOS application
        if: runner.os == 'macOS'
        env:
          MINIME_BUNDLE_ID: ${{ env.OFFICIAL_BUNDLE_ID }}
          MINIME_NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          MINIME_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MINIME_NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ./scripts/notarize-macos.sh
          cp "dist/Minime-${MINIME_VERSION}-macos.zip" .

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/minime.exe -DestinationPath "Minime-$env:MINIME_VERSION-windows.zip"

      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: tar -czf "Minime-${MINIME_VERSION}-linux.tar.gz" -C target/release minime

      - name: Remove the temporary signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          if [[ -n "${MINIME_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$MINIME_KEYCHAIN_PATH" || true
          fi
          rm -f "${MINIME_CERTIFICATE_PATH:-$RUNNER_TEMP/minime-developer-id.p12}"

      - uses: actions/upload-artifact@v7
        with:
          name: Minime-${{ github.ref_name }}-${{ matrix.platform }}
          path: |
            Minime-*-macos.zip
            Minime-*-windows.zip
            Minime-*-linux.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: Minime-v*-*
          merge-multiple: true
          path: release-assets

      - name: Build the in-app update installers
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          macos_asset="release-assets/Minime-${version}-macos.zip"
          windows_asset="release-assets/Minime-${version}-windows.zip"
          linux_asset="release-assets/Minime-${version}-linux.tar.gz"

          macos_sha="$(sha256sum "$macos_asset" | cut -d ' ' -f 1)"
          windows_sha="$(sha256sum "$windows_asset" | cut -d ' ' -f 1)"
          linux_sha="$(sha256sum "$linux_asset" | cut -d ' ' -f 1)"

          sed \
            -e "s/__VERSION__/$version/g" \
            -e "s/__MACOS_SHA256__/$macos_sha/g" \
            -e "s/__LINUX_SHA256__/$linux_sha/g" \
            packaging/update/minime-installer.sh.in \
            > release-assets/minime-installer.sh
          chmod +x release-assets/minime-installer.sh

          sed \
            -e "s/__VERSION__/$version/g" \
            -e "s/__WINDOWS_SHA256__/$windows_sha/g" \
            packaging/update/minime-installer.ps1.in \
            > release-assets/minime-installer.ps1

          (
            cd release-assets
            sha256sum \
              "Minime-${version}-macos.zip" \
              "Minime-${version}-windows.zip" \
              "Minime-${version}-linux.tar.gz" \
              minime-installer.sh \
              minime-installer.ps1 \
              > SHA256SUMS
          )

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "Minime $GITHUB_REF_NAME"
          fi
