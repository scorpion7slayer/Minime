name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Package macOS application
        if: runner.os == 'macOS'
        run: |
          ./scripts/package-macos.sh
          ditto -c -k --sequesterRsrc --keepParent dist/Minime.app Minime-macos.zip

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/minime.exe -DestinationPath Minime-windows.zip

      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: tar -czf Minime-linux.tar.gz -C target/release minime

      - uses: actions/upload-artifact@v4
        with:
          name: Minime-${{ matrix.platform }}
          path: |
            Minime-macos.zip
            Minime-windows.zip
            Minime-linux.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Minime-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Minime-macos.zip
            Minime-windows.zip
            Minime-linux.tar.gz
          generate_release_notes: true
