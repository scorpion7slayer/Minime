[package]
name = "minime"
version = "0.2.0"
edition = "2024"
description = "A small, private, exact-pixel image compressor built with GPUI"
license = "MIT"
repository = "https://github.com/scorpion7slayer/Minime"
rust-version = "1.88"

[dependencies]
anyhow = "1.0"
axoupdater = { version = "0.10.2", features = ["blocking"] }
env_logger = "0.11"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
image = { version = "0.25.10", default-features = false, features = [
  "bmp",
  "dds",
  "ff",
  "gif",
  "ico",
  "jpeg",
  "png",
  "pnm",
  "qoi",
  "tga",
  "tiff",
  "webp",
] }
log = "0.4"
oxipng = { version = "10.2", default-features = false, features = ["parallel"] }
reqwest = "0.13"
rfd = "0.17"
tempfile = "3.23"
tokio = { version = "1.48", features = ["rt"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData"] }

[build-dependencies]
embed-resource = "3.0.11"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
