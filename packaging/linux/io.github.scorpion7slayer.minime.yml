app-id: io.github.scorpion7slayer.minime
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: minime

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media

modules:
  - name: minime
    buildsystem: simple
    build-commands:
      - install -Dm755 minime /app/bin/minime
      - install -Dm644 io.github.scorpion7slayer.minime.desktop /app/share/applications/io.github.scorpion7slayer.minime.desktop
      - install -Dm644 io.github.scorpion7slayer.minime.metainfo.xml /app/share/metainfo/io.github.scorpion7slayer.minime.metainfo.xml
      - install -Dm644 minime.svg /app/share/icons/hicolor/scalable/apps/io.github.scorpion7slayer.minime.svg
    sources:
      - type: file
        path: ../../target/release/minime
      - type: file
        path: io.github.scorpion7slayer.minime.desktop
      - type: file
        path: io.github.scorpion7slayer.minime.metainfo.xml
      - type: file
        path: ../../assets/minime.svg
